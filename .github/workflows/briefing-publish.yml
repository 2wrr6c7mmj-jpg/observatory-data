name: Briefing publish
# 世界情勢観測「報道のまとめ」の公開。毎朝の定期タスク（Claude）が書いた台本を受け取り、確かめ → 音声（VOICEVOX コア）→
# docs/data/briefing/ の latest.json と latest.mp3 を main に書く。台本の書き方と起動の手順は briefing/EDITOR.md。
# モデルサーバーは使わない（数分で終わる）。読める出来事が足りないときは失敗で終わり、公開のファイルは書き換えない
# （前日のまとめが残り、画面は作成から 36 時間で出さなくなる）。
on:
  workflow_dispatch:
    inputs:
      script_b64:
        description: '台本の json を gzip して base64 にしたもの（briefing/EDITOR.md の手順が作る）'
        required: true
        type: string
permissions:
  contents: write   # docs/data/briefing/ のコミットだけ
concurrency:
  group: briefing-publish
  cancel-in-progress: false
env:
  FEED: https://observatory-watch.pages.dev/api/feeds
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # no token in .git/config while the engine runs; the push gets it (tools/push_retry.sh)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 公開はテスト成功時だけ（translate.yml・site-clock.yml と同じ）。briefing の試験は 1 秒かからない
      - name: Tests (briefing)
        run: python -m unittest discover -s tests -t . -p 'test_briefing_*.py'
      - name: Script (the input is data; size and shape are checked before anything reads it)
        env:
          SCRIPT_B64: ${{ inputs.script_b64 }}
        run: |
          python - <<'P'
          import base64, json, os, zlib
          raw = os.environ.get('SCRIPT_B64', '').strip()
          if not 0 < len(raw) <= 60000:
              raise SystemExit('::error title=briefing::台本の入力が空か、大きすぎる')
          try:
              z = zlib.decompressobj(16 + zlib.MAX_WBITS)
              data = z.decompress(base64.b64decode(raw, validate=True), 200001)
              doc = json.loads(data.decode('utf-8')) if len(data) <= 200000 and not z.unconsumed_tail else None
          except (ValueError, zlib.error):
              doc = None
          if not isinstance(doc, dict) or not isinstance(doc.get('events'), list) or not 1 <= len(doc['events']) <= 20:
              raise SystemExit('::error title=briefing::台本の形が違う（gzip + base64 の json で、events が 1〜20 件）')
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'script.json'), 'w', encoding='utf-8') as f:
              json.dump(doc, f, ensure_ascii=False)
          print(f"::notice title=briefing script::events={len(doc['events'])} bytes={len(data)}")
          P
      - name: Python parts (pinned, hashes checked) and VOICEVOX (pinned, SHA-256 checked)
        run: |
          python -m pip install --disable-pip-version-check -q --require-hashes -r briefing/requirements.txt
          bash tools/voicevox_setup.sh "$RUNNER_TEMP/vv"
      - name: Briefing (checks, voice)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python -m briefing --feed "$FEED" --script "$RUNNER_TEMP/script.json" --out "$RUNNER_TEMP/out" --vv-root "$RUNNER_TEMP/vv" | tee "$RUNNER_TEMP/briefing.log"
      - name: Report (annotations) and the decision to publish
        id: report
        if: always()
        run: |
          python - <<'P'
          import json, os
          out = os.path.join(os.environ['RUNNER_TEMP'], 'out', 'latest.json')
          if not os.path.exists(out):
              print('::error title=briefing::latest.json was not made')
              raise SystemExit(1)
          d = json.load(open(out, encoding='utf-8'))
          nl = '%0A'
          audio = d.get('audio') or {}
          print(f"::notice title=briefing summary::hold={d['hold']} {d.get('holdReason', '')} events={len(d['events'])} dropped={len(d['dropped'])} "
                f"audio={audio.get('seconds')}s bytes={audio.get('bytes')} counts={d['counts']} model={d['model']}")
          for i, e in enumerate(d['events'][:8], 1):
              s = e['sources']
              print(f"::notice title=event {i}::[{e['label']}] {e['headline']} | 出典 {s['count']} 系列 / {s['countries']} 国 | {e['start']}-{e['end']}s{nl}"
                    + nl.join(ln['text'] for ln in e['lines']))
          if d['dropped']:
              print('::warning title=dropped::' + nl.join(f"{x['headline']}: {x['reason']}" for x in d['dropped'][:20]))
          if d['hold'] or not audio.get('bytes'):
              print('::error title=briefing::読める出来事が足りない、または音声が無い。公開のファイルは書き換えない')
              raise SystemExit(1)
          P
      - name: Publish (docs/data/briefing)
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          dest=docs/data/briefing
          mkdir -p "$dest"
          cp -f "$RUNNER_TEMP/out/latest.json" "$RUNNER_TEMP/out/latest.mp3" "$RUNNER_TEMP/out/credits.txt" "$dest"/
          git add "$dest"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "データ更新: 報道のまとめ ($(date -u +%Y-%m-%dT%H:%MZ))"
          bash tools/push_retry.sh --title briefing
