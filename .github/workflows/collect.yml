name: Collect public data
on:
  schedule:
    # Taiwan MND publishes around 09:00 (UTC+8); collect at 10:23 JST.
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'List pages to walk (10 reports each). 3 = daily; larger = backfill (resumable)'
        default: '3'
      probe:
        description: 'Only print what the parser sees (no data change)'
        type: boolean
        default: false
      probe_ids:
        description: 'With probe: comma-separated report ids to print'
        default: ''
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  taiwan-mnd:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: |
          python -m unittest discover -s tests -t .
          node --test notam/*.test.mjs
      - name: Probe
        if: inputs.probe
        run: python -m collectors.taiwan_mnd --probe --probe-ids "${{ inputs.probe_ids }}"
      - name: Collect Taiwan MND daily reports
        if: ${{ !inputs.probe }}
        # A long backfill may stop at this limit; progress is saved per page and
        # published below, and the next run continues where this one stopped.
        timeout-minutes: 100
        env:
          MND_PAUSE_SECONDS: '1.5'
        run: python -m collectors.taiwan_mnd --pages "${{ inputs.pages || '3' }}"
      - name: Launch-related notices from NOTAM Watch (static files; no Worker requests)
        if: ${{ always() && !inputs.probe }}
        run: |
          node notam/extract.mjs /tmp/launch-extract.json
          python -m notam.launches /tmp/launch-extract.json
      - name: Rebuild JSO transit datasets (joins the Taiwan MND counts)
        if: ${{ always() && !inputs.probe }}
        run: python -m jso.build
      - name: Publish changed data
        if: ${{ always() && !inputs.probe }}
        run: |
          git add docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="observatory-data bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "データ更新: 台湾国防部 日報・統幕 ($(date -u +%Y-%m-%d))"
          git pull -q --rebase origin main
          git push
