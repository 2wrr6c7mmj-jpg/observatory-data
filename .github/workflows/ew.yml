name: Build early warning
# 早期警戒（試行、docs/ew/）の JSON を、行動層・展開層の元データの収集が終わるたびに作り直す。
# 書き込むのは docs/data/ew/ だけ（meta.json は手書きなので触らない）。標準ライブラリだけで動く。
on:
  workflow_run:
    workflows: ['Collect PLA Activity Tracker', 'Collect JCG Senkaku', 'Collect JSO transits', 'Exercises']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['analysis/ew.py', 'analysis/exercises.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ew
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest tests.test_ew
      - name: Build
        run: python -m analysis.ew
      - name: Publish changed results
        run: |
          git add docs/data/ew/indicators.json docs/data/ew/backtest.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "早期警戒を更新 ($(date -u +%Y-%m-%d))"
          bash tools/push_retry.sh --tries 4 --title ew
          v=$(python -c "import json;print(json.load(open('docs/data/ew/indicators.json'))['verdict'])")
          echo "::notice title=ew::判定 $v"
