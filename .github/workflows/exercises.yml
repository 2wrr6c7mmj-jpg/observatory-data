name: Exercises
# インド太平洋の軍事演習・訓練・実弾射撃・大規模展開を 3 時間ごとに集める。
# 世界情勢観測のニュース（/api/feeds、約 48 源）と、公式の発表（海幕・統幕）から候補を拾い、
# 公開のモデル（Qwen3-8B、Apache-2.0）を llama.cpp で Actions の CPU 上で動かして 1 件ずつ読み、
# 原文と照合して事象にまとめ、docs/data/exercises/ にだけ書く。キー・登録・利用上限なし。
on:
  push:
    branches: ['probe/exercises*']
  schedule:
    - cron: '43 */3 * * *'
  # GitHub runs the schedules of this repository only a few times a day (11-14: the hourly translation ran 3 times,
  # this schedule not once). So a run is also started when one of the other regular workflows ends; the "Due?" step
  # lets it go only when the last collection is 150 minutes old or more.
  workflow_run:
    workflows: ['Translate headlines', 'Collection health', 'Collect PLA Activity Tracker', 'Sentinel-1 ship candidates',
                'Collect JCG Senkaku', 'Ocean GFW match', 'AIS record', 'Site upkeep clock', 'Collect public data']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'push' && format('probe-exercises-{0}', github.ref_name) || 'exercises' }}
  cancel-in-progress: false
env:
  MODEL: unsloth/Qwen3-8B-GGUF:Q4_K_M
  LLAMA_CACHE: /home/runner/.cache/llama
jobs:
  exercises:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Due?
        id: due
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(python3 -c "import json;print(json.load(open('docs/data/exercises/status.json')).get('generatedAt',0)//1000)" 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          if [ "$age" -lt 9000 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "last collection $((age/60)) min ago: not due"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.due.outputs.go == 'true'

        with:
          python-version: '3.12'
      - name: Tests
        if: steps.due.outputs.go == 'true'
        run: python -m unittest discover -s tests -t .
      - name: PDF reader
        if: steps.due.outputs.go == 'true'
        run: |
          pip install -q pypdf
          command -v pdftotext && echo "pdftotext present" || echo "pdftotext absent (pypdf is used)"
      - name: Probe more official sources (robots.txt, status, links; no data change)
        if: steps.due.outputs.go == 'true' && (github.event_name == 'push')
        run: python -m exercises.probe_sources
      - name: llama.cpp (latest CPU release for Ubuntu x64)
        if: steps.due.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest releases first; take the first one that has the CPU build for Ubuntu x64.
          names=$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=10' --jq '.[] | .tag_name as $t | .assets[] | "\($t) \(.name)"')
          line=$(printf '%s\n' "$names" | grep -E ' [^ ]*bin-ubuntu-x64\.(zip|tar\.gz)$' | head -1)
          tag=${line%% *}; asset=${line#* }
          [ -n "$line" ] || { echo "::error title=llama.cpp assets::$(printf '%s ' $names | cut -c1-900)"; exit 1; }
          echo "release: $tag $asset"
          gh release download "$tag" --repo ggml-org/llama.cpp --pattern "$asset" --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/llama"
          case "$asset" in
            *.zip) unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/llama" ;;
            *) tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/llama" ;;
          esac
          bin=$(dirname "$(find "$RUNNER_TEMP/llama" -name llama-server -type f | head -1)")
          echo "LLAMA_BIN=$bin" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: steps.due.outputs.go == 'true'
        with:
          path: /home/runner/.cache/llama
          key: llama-model-qwen3-8b-q4km
      - name: Start the model server
        if: steps.due.outputs.go == 'true'
        run: |
          export LD_LIBRARY_PATH="$LLAMA_BIN:$LD_LIBRARY_PATH"
          nohup "$LLAMA_BIN/llama-server" -hf "$MODEL" --jinja -c 8192 -np 1 -t "$(nproc)" --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && { echo "ready after $((i*5)) s"; exit 0; }
            sleep 5
          done
          tail -40 "$RUNNER_TEMP/server.log"; echo "::error title=exercises::model server did not start"; exit 1
      - name: Probe (temporary directory)
        if: steps.due.outputs.go == 'true' && (github.event_name == 'push')
        run: |
          python -m exercises.run --model "$MODEL" --probe --out "$RUNNER_TEMP/ex" --limit 10 --minutes 25
          grep -E "prompt eval time|eval time" "$RUNNER_TEMP/server.log" | tail -4 || true
      - name: Collect and read
        if: steps.due.outputs.go == 'true' && (github.event_name != 'push' && github.ref == 'refs/heads/main')
        # Works on a copy, so that publishing never has to merge two versions of the same files.
        run: |
          mkdir -p "$RUNNER_TEMP/ex"
          cp -r docs/data/exercises/. "$RUNNER_TEMP/ex/" 2>/dev/null || true
          python -m exercises.run --model "$MODEL" --minutes 50 --out "$RUNNER_TEMP/ex"
      - name: Publish changed data
        if: steps.due.outputs.go == 'true' && (github.event_name != 'push' && github.ref == 'refs/heads/main')
        # The run's output is the whole of docs/data/exercises (it was built from the files at the start of the run).
        # Other workflows push other directories meanwhile, so each try starts from the newest main and puts the
        # output on top: no rebase of the same files, which failed on 11-14 when two runs overlapped.
        run: |
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            rm -rf docs/data/exercises && mkdir -p docs/data/exercises && cp -r "$RUNNER_TEMP/ex/." docs/data/exercises/
            git add -A docs/data/exercises
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "データ更新: 演習 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push && exit 0
            sleep 20
          done
          exit 1
