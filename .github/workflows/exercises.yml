name: Exercises
# インド太平洋の軍事演習・訓練・実弾射撃・大規模展開を 1 時間ごとに集める（2026-11-24 から。報道の保持が 24 時間のため）。
# 世界情勢観測のニュース（/api/feeds、約 48 源）と、公式の発表（海幕・統幕）から候補を拾い、
# 公開のモデル（Qwen3-8B、Apache-2.0）を llama.cpp で Actions の CPU 上で動かして 1 件ずつ読み、
# 原文と照合して事象にまとめ、docs/data/exercises/ にだけ書く。キー・登録・利用上限なし。
on:
  push:
    branches: ['probe/exercises*']
  # The collection is due every hour (2026-11-24: the site keeps 24 hours of reports; the "Due?" step lets a run go when the
  # last one is 50 minutes old or more;
  # a run that is not due only checks out and stops). GitHub runs the schedules of this repository only a few times a
  # day (11-14: the hourly translation ran 3 times, this schedule not once), so a run is started in three ways:
  # - this schedule, every hour (more chances to be run at all),
  # - the Site clock (tools/site_clock.sh), which runs all day and starts this workflow every hour when it is due,
  # - the end of the regular workflows below, that end a few times a day (health about 10, Site clock about 4, the
  #   collectors once or twice). 'AIS record' (48 a day) and 'Site upkeep clock' are not in the list any more: they
  #   started more than 100 runs a day that only said "not due".
  schedule:
    - cron: '43 * * * *'
  workflow_run:
    workflows: ['Translate headlines', 'Collection health', 'Collect PLA Activity Tracker', 'Sentinel-1 ship candidates',
                'Collect JCG Senkaku', 'Ocean GFW match', 'Site clock', 'Collect public data']
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Collect even when the last collection is less than 150 minutes old'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'push' && format('probe-exercises-{0}', github.ref_name) || 'exercises' }}
  cancel-in-progress: false
env:
  MODEL: unsloth/Qwen3-8B-GGUF:Q4_K_M   # the name sent to the server; the file and its version: tools/llama_server.sh
  LLAMA_CACHE: /home/runner/.cache/llama
jobs:
  exercises:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      # On main the newest main, not the commit of the event: a run that waited in the queue must not build from older
      # files and publish them over a newer collection (as proto.yml and health.yml). Other branches: the event's commit.
      # No token in .git/config while the model runs; the push gets it (PUSH_TOKEN, tools/push_retry.sh).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
          persist-credentials: false
      - name: Due?
        id: due
        env:
          FORCE: ${{ inputs.force }}
        run: |
          # push (probe) and a manual run go; the schedule, workflow_run and the Site clock's dispatch (force: false) only when due
          if [ "$GITHUB_EVENT_NAME" = push ] || { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$FORCE" = true ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(python3 -c "import json;print(json.load(open('docs/data/exercises/status.json')).get('generatedAt',0)//1000)" 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          if [ "$age" -lt 3000 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "last collection $((age/60)) min ago: not due"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.due.outputs.go == 'true'
        with:
          python-version: '3.12'
      - name: Tests
        if: steps.due.outputs.go == 'true'
        run: python -m unittest discover -s tests -t .
      - name: PDF reader
        if: steps.due.outputs.go == 'true'
        run: |
          pip install -q pypdf
          command -v pdftotext && echo "pdftotext present" || echo "pdftotext absent (pypdf is used)"
      - name: Probe more official sources (robots.txt, status, links; no data change)
        if: steps.due.outputs.go == 'true' && (github.event_name == 'push')
        run: python -m exercises.probe_sources
      - uses: actions/cache@v4
        if: steps.due.outputs.go == 'true'
        with:
          path: /home/runner/.cache/llama
          key: llama-model-qwen3-8b-q4km-a6adef13   # MODEL_REV in tools/llama_server.sh
      # llama.cpp (pinned image, by digest) and the model (pinned commit, SHA-256 checked): tools/llama_server.sh
      - name: Start the model server
        if: steps.due.outputs.go == 'true'
        run: bash tools/llama_server.sh -np 1
      - name: Probe (temporary directory)
        if: steps.due.outputs.go == 'true' && (github.event_name == 'push')
        run: |
          python -m exercises.run --model "$MODEL" --probe --out "$RUNNER_TEMP/ex" --limit 10 --minutes 25
          grep -E "prompt eval time|eval time" "$RUNNER_TEMP/server.log" | tail -4 || true
      - name: Collect and read
        if: steps.due.outputs.go == 'true' && (github.event_name != 'push' && github.ref == 'refs/heads/main')
        # Works on a copy, so that publishing never has to merge two versions of the same files.
        run: |
          mkdir -p "$RUNNER_TEMP/ex"
          cp -r docs/data/exercises/. "$RUNNER_TEMP/ex/" 2>/dev/null || true
          python -m exercises.run --model "$MODEL" --minutes 50 --out "$RUNNER_TEMP/ex"
      - name: Forecast recurring exercises
        if: steps.due.outputs.go == 'true' && (github.event_name != 'push' && github.ref == 'refs/heads/main')
        # 見込み: recurring exercises due within a month, and the record of earlier calls (exercises/forecast.py)
        run: |
          python -m exercises.forecast --out "$RUNNER_TEMP/ex"
          # the screen's one list: events, China/Russia/North Korea notices and the forecast (exercises/board.py)
          python -m exercises.board --out "$RUNNER_TEMP/ex"
      - name: Publish changed data
        if: steps.due.outputs.go == 'true' && (github.event_name != 'push' && github.ref == 'refs/heads/main')
        # The run's output is the whole of docs/data/exercises (it was built from the files at the start of the run).
        # Other workflows push other directories meanwhile, so each try starts from the newest main and puts the
        # output on top: no rebase of the same files, which failed on 11-14 when two runs overlapped.
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            if ! git fetch -q origin main; then sleep 20; continue; fi
            git reset -q --hard origin/main
            rm -rf docs/data/exercises && mkdir -p docs/data/exercises && cp -r "$RUNNER_TEMP/ex/." docs/data/exercises/
            git add -A docs/data/exercises
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "データ更新: 演習 ($(date -u +%Y-%m-%dT%H:%MZ))"
            bash tools/push_retry.sh --tries 1 --title exercises && exit 0
            sleep 20
          done
          exit 1
