name: Collect JSO transits
# 統合幕僚監部「中国／ロシア海軍艦艇・軍機の動向について」の新しい公表資料を取り込む（jso/update.py）。
# 一覧ページ（https://www.mod.go.jp/js/press/index.html）を1回読み、まだない資料の PDF だけを取得して
# jso/source/updates.jsonl に追記し、docs/data/jso を作り直す。robots.txt を確かめ、ボット対策のチャレンジが出たら止める。
# 書き込むのは jso/source/updates.jsonl と docs/data/jso だけ（他の収集とは書き込み先が別）。テストが通ったときだけ公開する。
# 公開のあと、Cloudflare D1「jso-naval-transits」に足りない資料を追加する（Secrets CLOUDFLARE_ACCOUNT_ID と
# CLOUDFLARE_D1_TOKEN がなければ飛ばす。書き込みは新しい資料の行と transit_pairs・vessels の作り直しで、1回あたり数千行以内）。
# probe/jso-update への push では取得と作り直しまでを行い、commit も D1 への書き込みもしない。
on:
  push:
    branches: ['probe/jso-update']
  schedule:
    - cron: '17 3,12 * * *'  # 12:17 / 21:17 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-jso-${{ github.ref }}
  cancel-in-progress: false
jobs:
  jso:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF text tool (poppler pdftotext)
        run: command -v pdftotext || { sudo apt-get update -q && sudo apt-get install -y -q poppler-utils; }
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Fetch new releases
        env:
          JSO_PAUSE_SECONDS: '3'
        run: python -m jso.update fetch
      - name: Rebuild docs/data/jso when releases were added
        run: |
          if python -m jso.update stale; then python -m jso.build; else echo "docs/data/jso is current"; fi
      - name: Check the rebuilt data
        run: python -m jso.update check
      - name: Publish
        if: ${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git add jso/source/updates.jsonl docs/data/jso
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "データ更新: 統幕 艦艇・軍機の動向 ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull -q --rebase && git push && exit 0
            sleep 20
          done
          exit 1
      - name: Cloudflare D1
        if: ${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: python -m jso.update d1
