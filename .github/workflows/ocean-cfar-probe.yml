name: Ocean CFAR v1/v2 probe (monitor plan M0)
# cfar-v2 PR3（実験中）：外洋（香港の南・台湾海峡・東シナ海・南シナ海北部・台湾東方）の Sentinel-1 を 20 m で取り、
# cfar-v1 と cfar-v2 の検出を同じ配列に通して比べる（ocean/cfar_probe.py）。
# probe 用ブランチへの push でだけ動く（workflow_dispatch・定期実行なし）。ブランチ名に -plan を含むと
# カタログと PU の見込みだけ（PU を使わない）。本番（collect・jcg-senkaku・sat-ships・proto・pla-tracker）と別の
# concurrency group で、外洋の probe どうしは 1 つの group（同時に走って上限を二重に使わない）。
# 結果（小さな JSON・GeoJSON・report.txt と docs/data/ocean/usage.csv の 1 行）は同じ probe ブランチにだけ commit する。
# 生の σ0 は保存しない（例外：--mode raw は原因調べ用に 2.56 km タイルを最大 12 枚／撮影だけ probe-raw/ocean/ に置く）。
# --mode wide は 40 m の広域スナップショット（ocean/wide.py）。モードとこの実行の上限（--max-pu）は probe ブランチの ocean/cfar_probe.args で指定（月の上限はここでは変えられない）。
# main は変えない。
# PU：上限はすべて BUDGET_MONTH の月の値（外洋 OCEAN_CAP・全体の自主上限 GLOBAL_CAP・湛江の毎日用の余裕 GLOBAL_MARGIN）。既定値はない。
# 実行月（UTC）が BUDGET_MONTH と違えば CDSE に何も送らず止める（python の終了コード 2）。実行中に月が変わったら次の要求の前に止める。
# 使用量は sat.port_archive gather で origin の全ブランチから集め（港・外洋・その他の usage の写し）、main の sat usage と合わせて
# 重複を除いた和で数える（港のアーカイブと同じ guard）。ports-archive.yml の OCEAN_CAP は外洋の予約に使われるので同じ値にする
# （OCEAN_CAP・BUDGET_MONTH・GLOBAL_CAP・GLOBAL_MARGIN が ports-archive.yml と違えば tests/test_ocean_cfar_probe.py が落ちる）。
# 使った PU は撮影ごとに usage に書き足し、例外・timeout（SIGTERM）で終わっても書く。終了コード 2＝月違い、3＝認証の失敗。
# 限界：cdse.Client 内部の 429・5xx の送り直し（最大 3 回、各最大 120 秒）は月の確認を通らず、月の境目を数分越えて送りうる。
# 港のアーカイブ（80 PU/分×最大 3 ジョブ）と同時に走ると合わせて 300 PU/分を超えうる（429 で送り直し）。リクエスト数の上限も同時実行では保証しない。
# 11 月以降は、司令部がその月の枠を決めてから BUDGET_MONTH・OCEAN_CAP・GLOBAL_CAP・GLOBAL_MARGIN を別コミットで書き直す。
on:
  push:
    branches: ['probe/ocean-cfar', 'probe/ocean-cfar*']
permissions:
  contents: write
concurrency:
  group: probe-ocean-cfar
  cancel-in-progress: false
env:
  # 2026-10 の値（10-31 司令部：外洋 4,600＝ports-archive.yml と同じ、全体 9,995、湛江の 10-31 の毎日の分 50）。
  # 10 月の外洋は既に 4,993 PU 使っているので、10 月中の外洋の残りは 0（10 月はもう取得しない）。
  BUDGET_MONTH: '2026-10'
  OCEAN_CAP: '4600'
  GLOBAL_CAP: '9995'
  GLOBAL_MARGIN: '50'
jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[ocean-cfar-result]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy and Pillow
        run: python -m pip install --disable-pip-version-check -q numpy==2.2.6 pillow==12.3.0
      - name: Tests
        run: python -m unittest tests.test_ocean_cfar_probe tests.test_ocean_modes tests.test_sat -v
      - name: Budget month
        run: |
          [ "$(date -u +%Y-%m)" = "$BUDGET_MONTH" ] || { echo "::error title=budget::上限は $BUDGET_MONTH の値。この月の上限を書き直すまで取得しない"; exit 2; }
      - name: Usage of this month (main's sat usage; every branch's ports, ocean and other usage CSVs)
        run: |
          mkdir -p "$RUNNER_TEMP/usage" "$RUNNER_TEMP/ports-usage"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git show origin/main:docs/data/sat/usage.csv > "$RUNNER_TEMP/sat.csv"
          # other-<file>--<n>.csv (the ocean copies among them), ports-<site>--<n>.csv, ports-all--<n>.csv; summed with each record once
          python -m sat.port_archive gather --other "$RUNNER_TEMP/usage" --ports "$RUNNER_TEMP/ports-usage"
          ls -l "$RUNNER_TEMP/usage" "$RUNNER_TEMP/ports-usage"
      - name: Probe
        env:
          CDSE_SH_CLIENT_ID: ${{ secrets.CDSE_SH_CLIENT_ID }}
          CDSE_SH_CLIENT_SECRET: ${{ secrets.CDSE_SH_CLIENT_SECRET }}
        run: |
          set -o pipefail
          TS="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          RUN="ocean/results/cfar_probe/$TS"
          echo "RUN_DIR=$RUN" >> "$GITHUB_ENV"
          DRY=""
          case "$GITHUB_REF_NAME" in *-plan*) DRY="--dry-run" ;; esac
          # Run-specific options (e.g. --lookback-days 90) from a file committed on the probe branch only.
          EXTRA=""
          [ -e ocean/cfar_probe.args ] && EXTRA="$(head -c 200 ocean/cfar_probe.args | tr -cd 'a-z0-9 .-')"
          echo "extra args: $EXTRA"
          case "$EXTRA" in *--budget-month*|*--ocean-cap*|*--global-cap*|*--global-margin*|*-usage*)
            echo "::error title=budget::月の上限と usage は yml の env だけで指定する（ocean/cfar_probe.args では不可）"; exit 1;; esac
          # probe/ocean-cfar-monitor-plan only (M0): the OData catalogue of 2026-10 per monitoring area, no PU,
          # no Sentinel Hub request (ocean/monitor.py plan).
          python -m ocean.monitor plan --month 2026-10 --out "$RUN" 2>&1 | tee "$RUNNER_TEMP/probe.log"
      - name: Report (annotations)
        if: always()
        run: |
          if [ -z "$RUN_DIR" ] || [ ! -e "$RUN_DIR/report.txt" ]; then
            if [ -s "$RUNNER_TEMP/probe.log" ]; then python -m sat.annotate text probe-log "$RUNNER_TEMP/probe.log"
            else echo "::notice title=ocean-cfar::probe を実行していない（report.txt・probe.log なし。前の段で止まった）"; fi
            exit 0
          fi
          python - "$RUN_DIR/report.txt" <<'EOF'
          import sys
          text = open(sys.argv[1], encoding="utf-8").read()
          parts = [text[i:i + 3800] for i in range(0, len(text), 3800)]
          for k, p in enumerate(parts[:30]):
              level = ("notice", "warning", "error")[k // 10 % 3]
              p = p.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level} title=ocean-cfar {k + 1}/{len(parts)}::{p}")
          EOF
      - name: Commit the result to this probe branch only
        if: always()
        run: |
          [ -n "$RUN_DIR" ] || exit 0
          git add docs/data/ocean "$RUN_DIR" || true
          [ -d probe-raw/ocean ] && git add probe-raw/ocean || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "probe: 外洋の cfar-v1/v2 比較 ${RUN_DIR##*/} [ocean-cfar-result]"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::notice title=ocean-cfar-commit::$(git rev-parse HEAD) ${RUN_DIR}"
