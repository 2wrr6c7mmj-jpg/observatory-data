name: Ocean coverage probe
# 外洋（台湾周辺 T・東シナ海 E・南西諸島 R）の Sentinel-1 の撮影頻度と公開の遅れの実測（probe のみ）。
# CDSE の OData カタログ（認証なし、PU を使わない）を読むだけで、データは commit しない。結果は注釈に出す。
# 手動実行（workflow_dispatch）は main に無いと使えないため、probe 用ブランチへの push で動く。本番の定期実行はない。
on:
  push:
    branches: ['probe/ocean-coverage', 'probe/ocean-coverage-*']
permissions:
  contents: read
concurrency:
  # 本番のワークフロー（collect・jcg-senkaku・sat-ships・proto）とは別の group
  group: probe-ocean-coverage-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (standard library only)
        run: python -m unittest tests.test_ocean_coverage -v
      - name: Probe (temporary directory only)
        run: |
          set -o pipefail
          python -m ocean.coverage_probe --days 60 --out "$RUNNER_TEMP/coverage_probe.json" --report "$RUNNER_TEMP/report" 2>&1 | tee "$RUNNER_TEMP/probe.log"
      - name: Report (annotations)
        # Logs and artifacts are on blob storage; annotations can be read through the REST API.
        # A step keeps at most 10 notices: the summary and maps here, orbits and modes in the next step.
        if: always()
        run: |
          python -m sat.annotate text probe-log "$RUNNER_TEMP/probe.log"
          for f in "$RUNNER_TEMP"/report/summary.txt "$RUNNER_TEMP"/report/map-*.txt; do
            [ -e "$f" ] || continue
            python -m sat.annotate text "$(basename "$f" .txt)" "$f"
          done
      - name: Report, orbits and modes (annotations)
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/report/orbits-*.txt "$RUNNER_TEMP"/report/modes-*.txt; do
            [ -e "$f" ] || continue
            python -m sat.annotate text "$(basename "$f" .txt)" "$f"
          done
      - name: Result JSON (annotations, xz + base64)
        if: always()
        run: |
          [ -e "$RUNNER_TEMP/coverage_probe.json" ] || exit 0
          xz -9e -k -c "$RUNNER_TEMP/coverage_probe.json" > "$RUNNER_TEMP/coverage_probe.json.xz"
          ls -l "$RUNNER_TEMP"/coverage_probe.json*
          python -m sat.annotate b64 coverage-json "$RUNNER_TEMP/coverage_probe.json.xz"
