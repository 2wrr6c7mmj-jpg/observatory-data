name: Collect PLA Activity Tracker
# probe/pla-tracker-robots: robots.txt を 1 回だけ読み、中身と判定を注釈に出す（CSV は取らない、commit しない）
on:
  push:
    branches: ['probe/pla-tracker-robots']
permissions:
  contents: read
concurrency:
  group: probe-pla-tracker-robots
  cancel-in-progress: false
jobs:
  robots:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: robots.txt (one request)
        run: |
          python - <<'PY'
          from collectors import polite, pla_tracker as p
          r = polite.raw_get(polite.robots_url(p.CSV_URL), p.UA, 30, None, polite.ROBOTS_MAX_BYTES)
          hdr = {k: r.headers.get(k) for k in ("content-type", "last-modified", "etag", "date", "cf-cache-status", "server", "age")}
          text = r.body.decode("utf-8", "replace")
          def esc(s): return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=robots http::HTTP {r.status} {esc(str(hdr))} bytes={len(r.body)}")
          for i in range(0, min(len(text), 4*3800), 3800):
              print(f"::notice title=robots body {i//3800+1}::{esc(text[i:i+3800])}")
          polite._cache.clear()
          for u in (p.CSV_URL, p.ABOUT_URL, p.SITE_URL):
              res = polite.check_robots(u, p.UA, getter=lambda url, ua, t, h, m: r)
              print(f"::notice title=robots verdict::{u} -> {res}")
          PY
