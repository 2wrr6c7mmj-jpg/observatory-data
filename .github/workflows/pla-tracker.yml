name: Collect PLA Activity Tracker
# PLA Activity Tracker（https://pla-tracker.skyfaring.net/、CC BY 4.0）の records.csv を 1 日 1 回、1 本だけ取得し、
# docs/data/pla-tracker/ にだけ書く。台湾国防部の日報の自動取得が robots.txt で拒否されているため（collect.yml で停止中）、
# 2026-10-31 以降の日ごとの数をこれで補う。collect.yml・jcg-senkaku.yml・sat-ships.yml とは別の concurrency group。
on:
  # probe 用ブランチへの push は一時ディレクトリに書くだけ（commit しない、結果は注釈）
  push:
    branches: ['probe/pla-tracker']
  schedule:
    # 既存の 01:23・03:43・05:17 UTC と重ねない。15:37 JST（国防部の日報は 09:00 台湾時間ごろ、集約はその後）
    - cron: '37 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'push' && format('probe-pla-tracker-{0}', github.ref_name) || 'collect-pla-tracker' }}
  cancel-in-progress: false
jobs:
  pla-tracker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Probe (temporary directory only, with the about page)
        if: github.event_name == 'push'
        run: |
          python -m collectors.pla_tracker --out "$RUNNER_TEMP/pla" --save-raw "$RUNNER_TEMP/records.csv" --about
          python -m sat.annotate text status "$RUNNER_TEMP/pla/status.json"
      - name: Probe, raw CSV (annotations, xz + base64)
        if: github.event_name == 'push'
        run: |
          [ -e "$RUNNER_TEMP/records.csv" ] || exit 0
          xz -9e -k -c "$RUNNER_TEMP/records.csv" > "$RUNNER_TEMP/records.csv.xz"
          ls -l "$RUNNER_TEMP"/records.csv*
          python -m sat.annotate b64 records-csv "$RUNNER_TEMP/records.csv.xz"
      - name: Collect
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: python -m collectors.pla_tracker
      - name: Publish changed data
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/data/pla-tracker
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "データ更新: PLA Activity Tracker ($(date -u +%Y-%m-%d))"
          # 他の収集も main に push する（書き込み先のディレクトリは別なので競合しない）
          for i in 1 2 3; do
            git pull -q --rebase && git push && exit 0
            sleep 20
          done
          exit 1
