name: Build analysis prototypes
# 分析の試作（docs/proto/）の JSON を、台湾国防部の収集（collect.yml）と海保の収集（jcg-senkaku.yml）が終わるたびに作り直す。
# 書き込むのは docs/proto/data/ だけ。標準ライブラリだけで動くので追加の導入はない。
on:
  workflow_run:
    workflows: ['Collect public data', 'Collect JCG Senkaku']
    types: [completed]
    branches: [main]
  # 統幕の資料（手作業で追加）が main に入ったときも作り直す。このワークフロー自身の書き込み（docs/proto/data/）は
  # paths に含まれないので再起動しない（GITHUB_TOKEN による push はそもそも次のワークフローを起動しない）
  push:
    branches: [main]
    paths: ['docs/data/jso/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: proto
  cancel-in-progress: false
jobs:
  build:
    # 収集が失敗しても、途中まで公開されたデータで作り直す（probe だけの実行でも差分が無ければ何もしない）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build (1-5)
        run: python -m analysis.proto
      # 第2弾（6〜10）が失敗しても、第1弾の結果は公開する（失敗はジョブの最後で赤にする）
      - name: Build (6-10)
        id: proto2
        continue-on-error: true
        run: python -m analysis.proto2
      - name: Publish changed results
        run: |
          git add docs/proto/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "分析の試作を更新 ($(date -u +%Y-%m-%d))"
          # 他のワークフロー（collect.yml など）も main に書き込むので、取り込んでからやり直す
          for i in 1 2 3 4; do
            git pull -q --rebase && git push && exit 0
            sleep 20
          done
          exit 1
      - name: Report proto2 failure
        if: steps.proto2.outcome == 'failure'
        run: |
          echo "::error::analysis.proto2 が失敗しました（第1弾の結果だけ公開）"
          exit 1
