name: Sentinel-1 recount probe (answered days)
# 目視確認（SYL・SLP・QGZ）の答えの日の Sentinel-1 だけを取り直す probe（sat/s1_recount.py、ユーザー了承 2026-11-03、合計 40 PU まで）。
# ops-4（2026-11-07、港が最優先・楡林→亜龍湾→古鎮口）：est-2 に既にある撮影は飛ばす（--skip-est2）。1 回目は QGZ を答えの日に近い
# 4 撮影までに絞った（--max-scenes QGZ=4、見込み 38.3 PU）が、実際は 2 帯のため 15 撮影で 25.5 PU（見積もりの 2/3）だったので、
# 2 回目で残る QGZ 4 撮影（約 5.1 PU）も 40 PU の内で取る。合計の上限は sat/s1_recount.py の MAX_PU_TOTAL が守る。
# probe 用ブランチ（probe/sat-s1-recount-*）への push でだけ動く。main は読むだけで変えない。取得した σ0（float16 の npz）と
# usage の行は同じ probe ブランチにだけ commit する（公開しない）。
# PU：この仕事の合計の上限 40 PU（sat/s1_recount.py の MAX_PU_TOTAL）と、月の自主上限（全体 9,000・余裕 450・外洋 7,000 の予約、
# ports-archive.yml と同じ値）の残りの小さい方。BUDGET_MONTH 以外の月は要求の前に止まる。
# concurrency group は港の probe と同じ（probe-ports-archive）：同じ残り枠を二重に割り当てない。
on:
  push:
    branches: ['probe/sat-s1-recount-*']
permissions:
  contents: write
concurrency:
  group: probe-ports-archive
  cancel-in-progress: false
env:
  BUDGET_MONTH: '2026-11'
  OCEAN_CAP: '7000'
  GUARD_ARGS: '--budget-month 2026-11 --global-cap 9000 --global-margin 450'
jobs:
  recount:
    if: ${{ !contains(github.event.head_commit.message, '[s1-recount-result]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy and Pillow
        run: python -m pip install --disable-pip-version-check -q numpy==2.2.6 pillow==12.3.0
      - name: Tests
        run: python -m unittest tests.test_sat_s1_recount tests.test_sat_port_archive -v
      - name: Budget month
        run: |
          [ "$(date -u +%Y-%m)" = "$BUDGET_MONTH" ] || { echo "::error title=budget::上限は $BUDGET_MONTH の値。この月の自主上限を書き直すまで取得しない"; exit 1; }
          case "$GUARD_ARGS" in *"--budget-month $BUDGET_MONTH "*) ;; *) echo "::error title=budget::GUARD_ARGS と BUDGET_MONTH の月が違う"; exit 1;; esac
      - name: Other CDSE usage of this month (main's sat; every branch's other and ports usage CSVs)
        run: |
          mkdir -p "$RUNNER_TEMP/usage" "$RUNNER_TEMP/ports-usage"
          git show origin/main:docs/data/sat/usage.csv > "$RUNNER_TEMP/usage/sat.csv"
          python -m sat.port_archive gather --other "$RUNNER_TEMP/usage" --ports "$RUNNER_TEMP/ports-usage"
      - name: Recount (S1 only)
        env:
          CDSE_SH_CLIENT_ID: ${{ secrets.CDSE_SH_CLIENT_ID }}
          CDSE_SH_CLIENT_SECRET: ${{ secrets.CDSE_SH_CLIENT_SECRET }}
        run: |
          rc=0
          python -m sat.s1_recount --site SYL SLP QGZ --raw probe-raw/s1-recount $GUARD_ARGS --ocean-cap "$OCEAN_CAP" \
            --usage "$RUNNER_TEMP"/usage/*.csv --ports-usage "$RUNNER_TEMP"/ports-usage/*.csv docs/data/sat/ports/*/usage.csv --usage-out docs/data/sat/s1_recount_usage.csv \
            --skip-est2 > "$RUNNER_TEMP/summary.json" 2> "$RUNNER_TEMP/recount.log" || rc=$?
          cat "$RUNNER_TEMP/recount.log" "$RUNNER_TEMP/summary.json"
          exit $rc
      - name: Report (annotations)
        if: always()
        run: |
          python -m sat.annotate text recount-summary "$RUNNER_TEMP/summary.json" || true
          python -m sat.annotate text recount-log "$RUNNER_TEMP/recount.log" || true
      - name: Commit to this probe branch only
        if: always()
        run: |
          git add docs/data/sat/s1_recount_usage.csv probe-raw/s1-recount 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "probe: 答えの日の Sentinel-1 の取り直し（SYL・SLP・QGZ） [s1-recount-result]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "::notice title=recount-commit::$(git rev-parse HEAD)"
