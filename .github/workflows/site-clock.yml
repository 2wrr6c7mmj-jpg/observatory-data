name: Site clock
# 世界情勢観測の背景更新（収集など）を 10 分ごと（最大 40 手、idle で終わる）、見出しの翻訳を 1 時間ごとに進める長い 1 本の実行。
# 背景更新を 20 分ごとにしたら D1 の無料枠（1 日 500 万行の読み取り）を使い切った（2026-11-18）。サイト側で「何をするか」の判断を 2 行の読み取りにしたので（observatory-watch の D1 行数の変更）、10 分ごとに戻した。
# GitHub はこのリポジトリの短い定期実行の多くを落とす（11-17：72 回の予定に 4 回）ので、
# 1 回 5 時間半動いて、終わりに次の回を自分で起動する（workflow_dispatch）。
# 途中で止まったときは下の schedule が拾い直す（同時に 2 本は動かない。translate.yml の手動実行も同じ group）。
# この実行が動いている間、site-upkeep.yml（3 時間ごと）は何もしない（背景更新はここだけが叩く）。
# 公開リポジトリなので Actions の時間は無料枠を消費しない。Cloudflare の cron は使わない。
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */3 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: site-clock
  cancel-in-progress: false
env:
  MODEL: unsloth/Qwen3-8B-GGUF:Q4_K_M   # the name sent to the server; the file and its version: tools/llama_server.sh
  LLAMA_CACHE: /home/runner/.cache/llama
jobs:
  clock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      # No token in .git/config (this run has contents: write and actions: write): the push gets it from PUSH_TOKEN
      # (tools/push_retry.sh), the hand-over from GH_TOKEN, each in its own step only.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (translation)
        run: python -m unittest tests.test_translate_headlines
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/llama
          key: llama-model-qwen3-8b-q4km-a6adef13   # MODEL_REV in tools/llama_server.sh
      # llama.cpp (pinned image, by digest) and the model (pinned commit, SHA-256 checked): tools/llama_server.sh
      - name: Start the model server
        run: bash tools/llama_server.sh
      # The tokens go to files (mode 600) that only tools/push_retry.sh and tools/site_upkeep.sh read; the clock
      # step and its children (the translation) do not get them in their environment.
      - name: Token files for the push and the upkeep
        env:
          PUSH_TOKEN: ${{ github.token }}
          # /api/maintenance checks it when the site has UPKEEP_TOKEN set; empty when the secret is not set (sent without)
          UPKEEP_TOKEN: ${{ secrets.UPKEEP_TOKEN }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/tokens"
          printf '%s' "$PUSH_TOKEN" > "$RUNNER_TEMP/tokens/push"
          printf '%s' "$UPKEEP_TOKEN" > "$RUNNER_TEMP/tokens/upkeep"
      - name: Run the clock
        env:
          PUSH_TOKEN_FILE: ${{ runner.temp }}/tokens/push
          UPKEEP_TOKEN_FILE: ${{ runner.temp }}/tokens/upkeep
        run: |
          git config user.name "observatory-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/site_clock.sh
      - name: Remove the token files
        if: always()
        run: rm -rf "$RUNNER_TEMP/tokens"
      - name: Hand over to the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-clock.yml --repo "$GITHUB_REPOSITORY" --ref main
