name: Site clock
# 世界情勢観測の背景更新（収集など）を 3 時間ごと、見出しの翻訳を 1 時間ごとに進める長い 1 本の実行。
# 背景更新を 20 分ごとにしたら D1 の無料枠（1 日 500 万行の読み取り）を使い切った（2026-11-18）。
# GitHub はこのリポジトリの短い定期実行の多くを落とす（11-17：72 回の予定に 4 回）ので、
# 1 回 5 時間半動いて、終わりに次の回を自分で起動する（workflow_dispatch）。
# 途中で止まったときは下の schedule が拾い直す（同時に 2 本は動かない）。
# 公開リポジトリなので Actions の時間は無料枠を消費しない。Cloudflare の cron は使わない。
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */3 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: site-clock
  cancel-in-progress: false
env:
  MODEL: unsloth/Qwen3-8B-GGUF:Q4_K_M
  LLAMA_CACHE: /home/runner/.cache/llama
jobs:
  clock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (translation)
        run: python -m unittest tests.test_translate_headlines
      - name: llama.cpp (latest CPU release for Ubuntu x64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=10' --jq '.[] | .tag_name as $t | .assets[] | "\($t) \(.name)"')
          line=$(printf '%s\n' "$names" | grep -E ' [^ ]*bin-ubuntu-x64\.(zip|tar\.gz)$' | head -1)
          tag=${line%% *}; asset=${line#* }
          [ -n "$line" ] || { echo "::error title=llama.cpp assets::$(printf '%s ' $names | cut -c1-900)"; exit 1; }
          gh release download "$tag" --repo ggml-org/llama.cpp --pattern "$asset" --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/llama"
          case "$asset" in
            *.zip) unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/llama" ;;
            *) tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/llama" ;;
          esac
          bin=$(dirname "$(find "$RUNNER_TEMP/llama" -name llama-server -type f | head -1)")
          echo "LLAMA_BIN=$bin" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/llama
          key: llama-model-qwen3-8b-q4km
      - name: Start the model server
        run: |
          export LD_LIBRARY_PATH="$LLAMA_BIN:$LD_LIBRARY_PATH"
          nohup "$LLAMA_BIN/llama-server" -hf "$MODEL" --jinja -c 8192 -t "$(nproc)" --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && { echo "ready after $((i*5)) s"; exit 0; }
            sleep 5
          done
          tail -40 "$RUNNER_TEMP/server.log"; echo "::error title=site clock::model server did not start"; exit 1
      - name: Run the clock
        run: |
          git config user.name "observatory-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/site_clock.sh
      - name: Hand over to the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-clock.yml --repo "$GITHUB_REPOSITORY" --ref main
