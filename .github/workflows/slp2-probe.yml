name: SLP v2 probe (mask, quay lines, baseline ro157)
# probe 専用（probe/ports-slp2-* への push でだけ動く。main にはマージしない）。亜龍湾 SLP の範囲 v2（北端 18.242N）の
# 陸マスク SLP-land-v2（sat/osm_mask.py、Overpass）・岸壁線 SLP-quay-v2（sat/quay_lines.py）・軌道 157 の基準 ro157-bl-1（sat/baseline.py、
# 湛江と同じ）を作り、この probe ブランチにだけ commit する。生の σ0 は保存しない（基準の統計だけ）。
# PU：この実行 60 PU（応答ヘッダの実 PU の上限）。10 月の安全ガード：sat（main）＋外洋（probe/ocean-* の最大、5,000 を予約）
# ＋港（probe/ports-* の ports_usage.csv の最大）＋この実行 ≤ 9,945。本番（collect・sat-ships 等）・他の probe と別の concurrency group。
on:
  push:
    branches: ['probe/ports-slp2-*']
permissions:
  contents: write
concurrency:
  group: probe-ports-slp2-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  slp2:
    if: ${{ !contains(github.event.head_commit.message, '[slp2-result]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy and Pillow
        run: python -m pip install --disable-pip-version-check -q numpy==2.2.6 pillow==12.3.0
      - name: Tests
        run: python -m unittest tests.test_sat_baseline -v
      - name: October guard
        id: cap
        run: |
          python -m sat.probe_slp2 guard --cap 60 | tee "$RUNNER_TEMP/guard.json"
          cap=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['cap_this_run'])" "$RUNNER_TEMP/guard.json")
          echo "cap=$cap" >> "$GITHUB_OUTPUT"
          python -c "import sys; sys.exit(0 if float(sys.argv[1]) >= 45 else 1)" "$cap" || { echo "::error title=guard::余裕 $cap PU（45 未満）のため取得しない"; exit 1; }
      - name: Land mask SLP-land-v2 (Overpass)
        run: python -m sat.osm_mask SLP --version 2 | tee "$RUNNER_TEMP/mask.json"
      - name: Quay lines SLP-quay-v2 (Overpass, 60 s later)
        run: |
          sleep 60
          python -m sat.quay_lines SLP --version 2 --out sat/masks | tee "$RUNNER_TEMP/lines.json"
      - name: Baseline ro157 (cap from the guard)
        env:
          CDSE_SH_CLIENT_ID: ${{ secrets.CDSE_SH_CLIENT_ID }}
          CDSE_SH_CLIENT_SECRET: ${{ secrets.CDSE_SH_CLIENT_SECRET }}
        run: |
          rc=0
          python -m sat.probe_slp2 baseline --cap "${{ steps.cap.outputs.cap }}" --scenes 24 --lookback 730 \
            --out sat/baselines --summary "$RUNNER_TEMP/summary.json" > /dev/null 2> "$RUNNER_TEMP/baseline.log" || rc=$?
          tail -n 50 "$RUNNER_TEMP/baseline.log"
          exit $rc
      - name: Report (annotations)
        if: always()
        run: |
          python -m sat.annotate text guard "$RUNNER_TEMP/guard.json" || true
          python -m sat.annotate text mask "$RUNNER_TEMP/mask.json" || true
          python -m sat.annotate text lines "$RUNNER_TEMP/lines.json" || true
          python -m sat.annotate text summary "$RUNNER_TEMP/summary.json" || true
          python -m sat.annotate text baseline-log "$RUNNER_TEMP/baseline.log" || true
      - name: Commit to this probe branch only (with the usage row)
        if: always()
        run: |
          mkdir -p probe-out
          cp "$RUNNER_TEMP"/guard.json "$RUNNER_TEMP"/mask.json "$RUNNER_TEMP"/lines.json "$RUNNER_TEMP"/summary.json "$RUNNER_TEMP"/baseline.log probe-out/ 2>/dev/null || true
          python - "$RUNNER_TEMP/guard.json" "$RUNNER_TEMP/summary.json" <<'PYEOF'
          import csv, io, json, subprocess, sys
          from pathlib import Path
          g = json.load(open(sys.argv[1]))
          try:
              s = json.load(open(sys.argv[2]))
          except Exception:
              sys.exit(0)
          best = max(g["ports_by_branch"].items(), key=lambda kv: kv[1])[0] if g["ports_by_branch"] else None
          text = subprocess.run(["git", "show", f"{best}:docs/data/sat/ports_usage.csv"], capture_output=True, text=True).stdout if best else ""
          rows = list(csv.DictReader(io.StringIO(text)))
          fields = ["run_utc", "site_id", "requests", "processing_units", "pu_source", "s1_scenes", "s2_days", "s2_clear",
                    "s1_processing_units", "s2_processing_units", "cap_pu", "archive_version"]
          rows.append({"run_utc": s["run_utc"], "site_id": "SLP", "requests": s.get("requests", 0),
                       "processing_units": s.get("processing_units", 0), "pu_source": s.get("pu_source", ""),
                       "s1_scenes": (s.get("orbits", {}).get("157") or {}).get("used", 0), "s2_days": 0, "s2_clear": 0,
                       "s1_processing_units": s.get("processing_units", 0), "s2_processing_units": 0,
                       "cap_pu": s.get("cap_pu", ""), "archive_version": "slp2-baseline-1"})
          out = io.StringIO()
          w = csv.DictWriter(out, fieldnames=fields, extrasaction="ignore", lineterminator="\n")
          w.writeheader(); w.writerows(rows)
          Path("docs/data/sat").mkdir(parents=True, exist_ok=True)
          Path("docs/data/sat/ports_usage.csv").write_text(out.getvalue())
          print("ports_usage.csv: rows from", best, "+ this run")
          PYEOF
          git add -f sat/masks/SLP-land-v2.* sat/masks/SLP-quay-v2.json sat/baselines/SLP-land-v2 probe-out docs/data/sat/ports_usage.csv 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "probe: 亜龍湾 SLP の範囲 v2 の陸マスク・岸壁線・基準 ro157 [slp2-result]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
