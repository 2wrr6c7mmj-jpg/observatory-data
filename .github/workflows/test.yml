name: Tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ['collectors/**', 'tests/**', 'jso/**', 'notam/**', 'sat/**', 'ocean/**', 'analysis/**', 'tools/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the collect workflows run the tests without numpy before they publish: a module that fails to import there
      # stops every collector (2026-11-03〜05). Same check here, before numpy is installed.
      - name: Tests without numpy (as the collect workflows)
        run: python -m unittest discover -s tests -t .
      # fix-2: every fixed-object registry (sat/fixed_registry/<site>.json) is valid before it is merged
      - name: Fixed-object registry check
        run: python -m sat.fixed_registry check
      - run: python -m pip install --disable-pip-version-check -q numpy==2.2.6 pillow==12.3.0
      - run: python -m unittest discover -s tests -t . -v
        env:
          OBS_REQUIRE_SAT_DEPS: '1'
      - run: node --test notam/*.test.mjs
