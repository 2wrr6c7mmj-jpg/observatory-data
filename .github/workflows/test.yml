name: Tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ['collectors/**', 'tests/**', 'jso/**', 'notam/**', 'sat/**', 'ocean/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy==2.2.6 pillow==12.3.0
      - run: python -m unittest discover -s tests -t . -v
      - run: node --test notam/*.test.mjs
