name: Translate headlines
# 世界情勢観測のニュースの見出しで、サイトにまだ日本語訳がないものを訳し、
# docs/data/translations/ にだけ書く（サイトの背景更新が GitHub Pages から取り込む）。
# 訳は公開のモデル（Qwen3-8B、Apache-2.0。思考なしで JSON の形に縛って出させる）を llama.cpp で Actions 上の CPU で動かす。
# キー・登録・利用上限なし。公開リポジトリなので Actions の時間は無料。
# 定期の翻訳は site-clock.yml の中で行う（2026-11-18。同じファイルへの同時書き込みを避けるため、ここの schedule は外した）。
on:
  push:
    branches: ['probe/translate']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # A manual run shares the group of site-clock.yml, which translates every hour into the same files: the two never run
  # at the same time (a manual run waits; while the clock chain goes on, its next run may take the queue's place).
  group: ${{ github.event_name == 'push' && format('probe-translate-{0}', github.ref_name) || 'site-clock' }}
  cancel-in-progress: false
env:
  MODEL: unsloth/Qwen3-8B-GGUF:Q4_K_M   # the name sent to the server; the file and its version: tools/llama_server.sh
  LLAMA_CACHE: /home/runner/.cache/llama
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # No token in .git/config while the model and the translation run; the push gets it (tools/push_retry.sh).
      # On main the newest main (a run that waited for site-clock starts from its translations), else the event's commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/llama
          key: llama-model-qwen3-8b-q4km-a6adef13   # MODEL_REV in tools/llama_server.sh
      # llama.cpp (pinned image, by digest) and the model (pinned commit, SHA-256 checked): tools/llama_server.sh
      - name: Start the model server
        run: bash tools/llama_server.sh
      - name: Probe (temporary directory, 5 minutes)
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/tr"
          python -m translate.headlines --model "$MODEL" --minutes 5 --out "$RUNNER_TEMP/tr"
          python - <<'P'
          import json, os
          d = json.load(open(os.environ['RUNNER_TEMP'] + '/tr/headlines-ja.json'))
          for x in d['items'][:15]:
              print(f"::notice title=sample::{x['original'][:120]} → {x['translated'][:120]}")
          P
          grep -E "eval time|tokens per second" "$RUNNER_TEMP/server.log" | tail -4 || true
      - name: Translate
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/data/translations
          python -m translate.headlines --model "$MODEL" --minutes 40
      - name: Publish changed data
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add docs/data/translations
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          export GIT_AUTHOR_NAME="observatory-data bot" GIT_COMMITTER_NAME="observatory-data bot"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "データ更新: 見出しの翻訳 ($(date -u +%Y-%m-%dT%H:%MZ))"
          bash tools/push_retry.sh --title translate
